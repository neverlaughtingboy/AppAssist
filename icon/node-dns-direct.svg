<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#16B8D8"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- 顶部高光 -->
    <rect x="0" y="0" width="512" height="260" fill="#FFFFFF" opacity="0.06"/>

    <!-- 背景点缀：网络节点 -->
    <circle cx="88" cy="112" r="10" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="428" cy="96" r="7" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="446" cy="210" r="11" fill="#FFFFFF" opacity="0.14"/>

    <!-- DNS 文字 -->
    <text x="256" y="262" text-anchor="middle"
          font-family="Helvetica Neue, PingFang SC, Arial, sans-serif"
          font-size="170" font-weight="800" letter-spacing="4"
          fill="#FFFFFF">DNS</text>

    <!-- 直连箭头（绿 = DIRECT） -->
    <line x1="122" y1="352" x2="352" y2="352"
          stroke="#34C759" stroke-width="30" stroke-linecap="round"/>
    <polygon points="352,322 414,352 352,382" fill="#34C759"/>

    <!-- 起点：本机节点 -->
    <circle cx="112" cy="352" r="18" fill="#FFFFFF"/>
    <circle cx="112" cy="352" r="8" fill="#3B5BFF"/>
  </g>
</svg>
